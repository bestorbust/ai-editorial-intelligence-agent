name: Intelligence Refresh

on:
  # Run automatically every 15 minutes
  schedule:
    - cron: "*/15 * * * *"

  # Allow manual runs from GitHub Actions UI
  workflow_dispatch:

concurrency:
  group: intelligence-refresh
  cancel-in-progress: false

jobs:
  refresh-intelligence:
    name: Run Intelligence Pipeline

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      # ========================================================
      # Checkout Repository
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ========================================================
      # Python
      # ========================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt


      # ========================================================
      # Install Dependencies
      # ========================================================

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip


      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt


      # ========================================================
      # Run Intelligence Pipeline
      # ========================================================

      - name: Run intelligence refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.INTELLIGENCE_GITHUB_TOKEN }}

          PYTHONUNBUFFERED: "1"

        run: |
          python -m backend.run_refresh